name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/serve-kiosk.sh
          bash -n scripts/check-kiosk.sh

      - name: Check kiosk JavaScript
        run: bash scripts/check-kiosk.sh

      - name: Check public config hygiene
        run: |
          test ! -f config.local.js
          # The revoked key below is a canary: it must never reappear in the
          # tree. One character is bracketed ([X]) so the regex matches the real
          # key but not this line — otherwise the check finds itself in this file
          # and fails on every run. Keep the bracket if you edit this.
          ! grep -RE "IjSX7wKyp8JzJi8Or4cqUXfiytD7FBgaj9ylbrR68Co[X]ovvl" .
          grep -q '<KIOSK_API_KEY>' index.html
          grep -q '<KIOSK_API_KEY>' config.example.js
